<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="crossfadio-mark-title crossfadio-mark-desc">
  <title id="crossfadio-mark-title">Crossfadio</title>
  <desc id="crossfadio-mark-desc">Two colorful audio signals crossfade around a play button.</desc>
