<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" role="img" aria-labelledby="cover-placeholder-title cover-placeholder-desc">
  <title id="cover-placeholder-title">Crossfadio</title>
  <desc id="cover-placeholder-desc">Crossfadio crossfade mark used when no album artwork is available.</desc>
  <defs>
    <radialGradient id="cover-bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(154 116) rotate(48) scale(790 680)">
      <stop stop-color="#12333A"/>
      <stop offset=".42" stop-color="#111827"/>
      <stop offset="1" stop-color="#09090B"/>
    </radialGradient>
    <linearGradient id="cover-cool" x1="12" y1="46" x2="52" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="cover-warm" x1="12" y1="18" x2="52" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
  </defs>
  <rect width="720" height="720" rx="96" fill="url(#cover-bg)"/>
  <rect x="58" y="58" width="604" height="604" rx="78" fill="#09090B" fill-opacity=".72" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="2"/>
  <g transform="translate(72 72) scale(9)">
    <path d="M12 44C21 44 24 20 34 20C43 20 46 39 52 44" fill="none" stroke="url(#cover-cool)" stroke-width="7" stroke-linecap="round"/>
    <path d="M12 20C21 20 24 44 34 44C43 44 46 25 52 20" fill="none" stroke="url(#cover-warm)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="7.5" fill="#18181B" stroke="#FFFFFF" stroke-opacity=".2"/>
    <path d="M30 27.8L37 32L30 36.2V27.8Z" fill="#FAFAFA"/>
  </g>
</svg>
